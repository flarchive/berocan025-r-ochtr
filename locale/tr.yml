        honeypot_strict_help: API'ye doğrudan istek atan betikler gibi formu kullanmadan gönderilen misafir kayıtlarını da reddeder. Hesapları API üzerinden oluşturan bir uygulama, SSO köprüsü ya da başka bir araç kullanıyorsanız bunu kapalı bırakın.
        honeypot_strict_label: Formu atlayan kayıtları reddet
        introduction: Bu forumun her kayıtta kendi başına yaptığı, dışarıdaki hiçbir servise veri göndermeyen kontroller. StopForumSpam sorguları için ayrı bir sekme vardır.
        registration_throttle_help: Flarum birinin ne sıklıkla gönderi yapabileceğini sınırlar, ancak ne sıklıkla hesap açabileceğini sınırlamaz. 0 bu özelliği kapatır. Ofislerin, okulların ve mobil operatörlerin tek bir IP adresini birçok kişi arasında paylaştırdığını unutmayın.
