        push_notif_preference_default_to_email_text: Etkinleştirilirse, e-posta bildirimi varsayılan olarak açık olan tüm bildirim türlerinde anlık bildirimler de varsayılan olarak açık olur. Kapalıysa anlık bildirimler varsayılan olarak kapalıdır.
        push_notification_ttl_label: Anlık bildirim geçerlilik süresi
        push_notification_ttl_text: Teslim edilemeyen anlık bildirimlerin süresi dolmadan önce bildirim servisinde ne kadar bekletileceği (saniye).
        share_buttons_label: Paylaş düğmelerini etkinleştir
        share_buttons_text: Etkinleştirilirse tartışmalara, mesajlara ve kullanıcılara bir "Paylaş" düğmesi eklenir.
        user_max_subscriptions_label: Kullanıcı başına en fazla anlık bildirim aboneliği
        user_max_subscriptions_text: Her kullanıcı aynı anda kaç anlık bildirim aboneliğine sahip olabilir? Bir kullanıcıya bildirim gittiğinde her abonelik için ayrı bir API çağrısı yapılır. Her abonelik genellikle kullanıcının kullandığı bir tarayıcıya karşılık gelir.
        window_controls_overlay_label: Pencere Denetimleri Katmanını etkinleştir
        window_controls_overlay_text: 'Destekleyen bir masaüstü tarayıcıda Pencere Denetimleri Katmanı, seçilen görüntüleme modunun önüne geçer.


          Etkinleştirilirse kullanıcılar tarayıcının başlık çubuğunu gizleyerek daha yerel uygulama benzeri bir deneyim yaşayabilir. Katmanın gerçekten uygulanıp uygulanmayacağı kullanıcının tercihine ve tarayıcı uyumluluğuna bağlıdır. Bunu etkinleştirdikten sonra başlık çubuğunuzu CSS/JS ile özelleştirmeniz gerekir; aksi halde denetimler forumun üst menüsünün üzerine biner ve pencere neredeyse sürüklenemez hale gelir.


          Ayrıca bakınız: <compatibilitylink>Pencere Denetimleri Katmanı tarayıcı uyumluluğu</compatibilitylink> ve <learnlink>Microsoft Learn''de Pencere Denetimleri Katmanı hakkında</learnlink>

          '
