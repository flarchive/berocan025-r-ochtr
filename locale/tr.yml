    settings:
      content-filter:
        burst_minutes_label: Kaç dakika içinde
        burst_post_count_help: Yeni bir hesap aşağıdaki dakika içinde başka tartışmalarda bu kadar gönderi yaptığında, yavaşlayana kadar sonraki her gönderisi spam olarak puanlanır. Tüm kullanıcılar izlense bile yalnızca yeni hesaplar için geçerlidir. Gönderinin yapıldığı tartışmadaki gönderiler sayılmaz; böylece tek bir konudaki sohbet yakalanmaz. Onay bekleyen gönderiler de sayılır, düzenlemeler sayılmaz. 0 ile sınır yoktur.
        burst_post_count_label: Kısa sürede izin verilen gönderi sayısı
        detect_local_phones_help: 0 ile başlayan, ülke kodu olmadan yazılmış numaraları da (örneğin 0532 123 45 67 veya 0212 555 00 00) sayar. Forumunuzdaki spamlar yerel numara içeriyorsa bunu açın. Bu numaraları tarih ve referans numaralarından ayırt etmek uluslararası numaralara göre daha zordur, bu yüzden arada sıradan bir gönderinin işaretlenmesini bekleyin. Telefon numarası algılamanın açık olması gerekir.
        detect_local_phones_label: Yerel biçimdeki telefon numaralarını da algıla
        detect_repeats_help: Yeni bir hesabın, son gönderilerinden biriyle aynı şeyi söyleyen gönderisini işaretler; büyük/küçük harf, boşluk, noktalama ve biçimlendirme yok sayılır. Tüm kullanıcılar izlense bile yalnızca yeni hesaplar için geçerlidir. 40 karakterden kısa gönderiler tekrarlanabilir; yazarın sildiği gönderiler sayılmaz.
        detect_repeats_label: Tekrarlanan gönderileri algıla
        flag_account_choose_button: Seç…
        flag_account_default: 'Varsayılan: ilk yönetici'
        flag_account_default_button: Varsayılanı kullan
        flag_account_help: Moderasyon kuyruğunda otomatik spam bildirimlerinin yazarı olarak gösterilir. Varsayılanda bırakılırsa bildirimleri ilk yönetici yapar.
        flag_account_in_code: extend.php içinde assignFlagsToModerator() ile seçildiği için buradan değiştirilemez.
        flag_account_label: Spam bildirimlerini yapan hesap
        flag_account_missing: Seçilen hesap artık mevcut değil; siz başka bir hesap seçene kadar spam bildirimlerini ilk yönetici yapacak.
        flag_account_modal_title: Spam bildirimlerini yapacak hesabı seçin
        held_email_domains_heading: Yeni Hesapları E-posta Alan Adına Göre Beklet
        held_email_domains_help: E-posta adresi bu alan adlarından birinde olan yeni bir hesabın her gönderisi, içeriği ne olursa olsun onaya bekletilir. Her satıra bir alan adı yazın; alt alan adları da dahildir. Bir hesap, tüm kullanıcılar izlense bile yukarıdaki gönderi sayısı veya hesap yaşı sınırının içindeyken yeni sayılır; bekletilen gönderiler ancak onaylandıktan sonra gönderi sayısına eklenir. Yalnızca yeni gönderiler bekletilir; düzenlemeler içerik filtresine bırakılır. İçerik filtresi kapalıyken de geçerlidir. Yöneticiler ve grubu tartışma gizleyebilen kişiler hiçbir zaman bekletilmez. Bildirimleri görebilen moderatörlere eşleşen alan adı gösterilir.
        held_email_domains_label: Bekletilecek e-posta alan adları
        monitor_all_users_help: Yalnızca yeni hesapların değil, tüm gönderileri denetler. Bu kapalıyken bir hesap aşağıdaki sınırları geçtikten sonra bir daha incelenmez; bu da tam olarak hesabı ele geçirilmiş bir üyenin ya da bir süre zararsız gönderiler yapıp sonra spam atan birinin durumudur. Yöneticiler ve grubu tartışma gizleyebilen kişiler her durumda izlenmez. Köklü üyelerde daha fazla yanlış alarm görebilirsiniz; açmadan önce eşiklerinizi gözden geçirin.
        monitor_all_users_label: Tüm kullanıcıları izle
        monitor_window_held_only: Tüm kullanıcılar izlenirken aşağıdaki iki sınır yalnızca e-posta alan adı bekletmesinin hangi hesaplara uygulanacağını belirler.
        posting_rate_heading: Gönderi Hızı
