      mime_order: Kurallar yukarıdan aşağıya eşleştirilir ve ilk eşleşen kazanır; bu yüzden daha özel kuralları genel olanların üstüne koyun.
      s3_acl_unsupported: '{provider} ACL desteklemez. Herkese açık erişimi sağlayıcının kendi panelinden yönetin.'
      s3_endpoint: Sağlayıcının S3 API adresi; kovanızın herkese açık adresi değil. Amazon S3 için gerekmez.
      s3_path_style: Kovayı alan adı yerine URL yoluna koyar. MinIO ve Cloudflare R2 için gereklidir; sağlayıcı seçtiğinizde otomatik ayarlanır.
      s3_provider: Sağlayıcınızı seçmek aşağıdaki uç nokta biçimini, adresleme stilini ve ACL desteğini belirler. Sağlayıcınız listede yoksa "Diğer S3 uyumlu" seçeneğini seçin.
      storage_configure_another: Başka depolama servisleri de kurulu ama henüz yapılandırılmamış. Birini yapılandırmak, onu bir dosya türüne atayana kadar dosyaların nereye gittiğini değiştirmez.
      storage_intro: Yapılandırdığınız ya da bir dosya türünün kullandığı servisler burada gösterilir. Bir servisi, hiçbir dosya türünü ona yönlendirmeden önce de kurabilirsiniz; hazır olduğunuzda Dosyalar sekmesinden atayın.
      storage_not_installed: Amazon S3, Cloudflare R2 ya da Qiniu mu arıyorsunuz? Bunlar ek bir paket gerektirir — <a>depolama bağdaştırıcılarını kurma</a> bölümüne bakın.
      thumbnail_quality: WebP ve JPEG küçük resimlerine uygulanan 1 ile 100 arası kodlama kalitesi. Yüksek değerler daha net görünür ama daha büyük dosyalar üretir. GIF ve PNG küçük resimleri kayıpsızdır ve bu ayarı yok sayar. Mevcut küçük resimler, backfill komutuyla yeniden oluşturulana kadar mevcut kalitelerini korur.
