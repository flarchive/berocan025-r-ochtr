        display_options:
          browser: Tarayıcı
          fullscreen: Tam ekran
          minimal_ui: Minimal arayüz
          standalone: Bağımsız
        display_text: 'Uygulama simgesinden açıldığında nasıl görüneceği:


          Bağımsız: Tarayıcının adres çubuğu olmadan ayrı bir uygulama penceresi.

          Minimal arayüz: Bağımsız gibi, ancak geri ve yenile gibi temel gezinme düğmeleriyle.

          Tam ekran: Tarayıcı denetimleri olmadan tüm ekranı kullanır.

          Tarayıcı: Normal bir tarayıcı sekmesinde veya penceresinde açılır.


          Seçilen mod desteklenmiyorsa tarayıcılar başka bir moda geçebilir.

          '
        heading: Diğer
        orientation_label: Ekran yönü
        orientation_options:
          any: Herhangi
          landscape: Yatay
          landscape_primary: Yatay (birincil)
          landscape_secondary: Yatay (ikincil)
          natural: Doğal
          portrait: Dikey
          portrait_primary: Dikey (birincil)
          portrait_secondary: Dikey (ikincil)
        orientation_text: 'Herhangi: Uygulama cihazla birlikte döner.

          Doğal: Cihazın olağan yönü; telefonlarda genellikle dikey, monitörlerde yatay.

          Dikey: Uygulama dikey kalır.

          Yatay: Uygulama yatay kalır.


          Dikey ve Yatay, aralarında 180 derece olan iki konuma izin verir. Yalnızca birini kullanmak için Birincil veya İkincil seçeneğini seçin. Telefonda Dikey (birincil) genellikle normal duruş, Dikey (ikincil) ise baş aşağıdır. Yatayda hangi yönün birincil olduğu cihaza bağlıdır.


          Bazı tarayıcılar ve cihazlar seçilen yönü yok sayabilir.

          '
