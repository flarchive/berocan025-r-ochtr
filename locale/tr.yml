  email:
    activate_account:
      body: 'Bu e-posta adresiyle {forum} sitesine kaydolundu.


        Hesabını etkinleştirmek için aşağıdaki bağlantıya tıkla:

        {url}


        Bu e-posta gelen kutunda değil de Spam / Gereksiz klasörüne düştüyse, lütfen "Spam değil" olarak işaretle. Böylece sonraki bildirimlerimiz doğrudan gelen kutuna ulaşır.


        Kaydolan sen değilsen bu e-postayı dikkate alma; hesap etkinleştirilmeden hiçbir işlem yapılamaz.

        '
      subject: Flarum Türkiye hesabını etkinleştir
    confirm_email:
      body: '{forum} sitesindeki hesabının e-posta adresi bu adresle değiştirildi.


        Yeni adresini onaylamak için aşağıdaki bağlantıya tıkla:

        {url}


        Bu e-posta gelen kutunda değil de Spam / Gereksiz klasörüne düştüyse, lütfen "Spam değil" olarak işaretle. Böylece sonraki bildirimlerimiz doğrudan gelen kutuna ulaşır.


        Bu değişikliği sen yapmadıysan bu e-postayı dikkate alma.

        '
      subject: Yeni e-posta adresini doğrula
