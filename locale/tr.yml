        theme_color_label: Tema rengi
        theme_color_text: Bazı cihazlar uygulamayı gösterirken bu rengi kullanır; örneğin Android'in uygulama değiştiricisinde sitenin çevresindeki renk.
      firebase_config:
        heading: Firebase
        help_text: Uygulamanızı Apple App Store'da yayımlarken anlık bildirim desteği eklemek için Firebase kullanmanız gerekir. Firebase hizmet yapılandırmanızı oluşturup buraya yükleyin. <a>Belgelere göz atın</a>.
        upload_file: Dosya yükle
        upload_successful: Firebase yapılandırmanız başarıyla yüklendi.
      heading: Mobil Uygulama (PWA) Yapılandırması
      logo_heading: Logolar ve Simgeler
      logo_size_text: '{size}x{size} piksele ölçeklenecek bir logo yükleyin.'
      logo_text: 'Uygulamanın kurulabilmesi için en az bir logo yüklemeniz gerekir. Tüm logolar kare olmalıdır; kare değilse yeniden boyutlandırılır ve gerilebilir.


        Aşağıda birkaç boyut seçeneği vardır. Daha fazla cihazı desteklemek için mümkün olduğunca çoğuna logo yüklemenizi öneririz.


        Küçük boyutlar için de tek bir büyük logo yükleyebilirsiniz. Örneğin 1000x1000 piksellik bir logoyu aşağıdaki TÜM alanlara yükleyebilirsiniz. Ancak 512x512 alanına 50x50 piksellik bir logo yüklerseniz çok fazla gerilir.

        '
      maintenance:
        debug_label: Hata ayıklama modunu etkinleştir
        debug_text: Bildirimlerle ilgili bilgileri `storage/logs` klasörüne yazar. Günlüklerin gereksiz yere dolmaması için genellikle kapalı tutulmalıdır.
        heading: Bakım
        reset_vapid_button: VAPID anahtarlarını sıfırla
        reset_vapid_confirm: VAPID anahtarlarını sıfırlamak mevcut anahtarları kullanan tüm abonelikleri kaldırır; kullanıcılar siteyi bir sonraki ziyaretlerine kadar bildirim alamaz. Bunu yalnızca anlık bildirimleri ilk kez kurarken ya da bildirimler hiç çalışmıyorsa ve yukarıda eksik VAPID anahtarı uyarısı varsa yapın.
        reset_vapid_success: VAPID anahtarları sıfırlandı. {count} abonelik sıfırlandı. Güncel durum raporunu görmek için sayfayı yenileyin.
        reset_vapid_text: VAPID anahtarlarını yeniden oluşturur ve mevcut anahtarları kullanan tüm abonelikleri siler.
      other:
