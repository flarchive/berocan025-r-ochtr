    reset_password:
      body: '{forum} sitesindeki hesabın için şifre sıfırlama talebinde bulunuldu.


        Yeni şifreni belirlemek için aşağıdaki bağlantıya tıkla:

        {url}


        Bu e-posta gelen kutunda değil de Spam / Gereksiz klasörüne düştüyse, lütfen "Spam değil" olarak işaretle. Böylece sonraki bildirimlerimiz doğrudan gelen kutuna ulaşır.


        Bu talebi sen yapmadıysan bu e-postayı dikkate alma; şifren değişmeyecek.

        '
      subject: Şifre sıfırlama bağlantın
