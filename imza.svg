<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Türkçe çeviri: Flarum Türkiye">
  <title>Türkçe çeviri · Flarum Türkiye</title>
  <defs>
    <linearGradient id="ftiz-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2914F"/><stop offset="1" stop-color="#E35D22"/>
    </linearGradient>
    <linearGradient id="ftiz-txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6A064"/><stop offset=".5" stop-color="#E7672E"/><stop offset="1" stop-color="#F6A064"/>
    </linearGradient>
    <path id="ftiz-b" d="M14 8h36a8 8 0 0 1 8 8v22a8 8 0 0 1-8 8H30l-12 10v-10h-4a8 8 0 0 1-8-8V16a8 8 0 0 1 8-8z"/>
    <clipPath id="ftiz-c"><use href="#ftiz-b"/></clipPath>
    <style>
      .ftiz-balon{transform-origin:34px 34px;animation:ftiz-yuz 5s ease-in-out infinite}
      .ftiz-par{animation:ftiz-kay 3.6s ease-in-out infinite}
      .ftiz-c1{animation:ftiz-nokta 1.8s ease-in-out infinite}
      .ftiz-c2{animation:ftiz-nokta 1.8s ease-in-out infinite .3s}
      .ftiz-ad{font:700 20px 'Poppins','Segoe UI',system-ui,-apple-system,Arial,sans-serif;letter-spacing:-.4px}
      .ftiz-ust{font:600 10px 'Poppins','Segoe UI',system-ui,-apple-system,Arial,sans-serif;letter-spacing:2.4px}
      .ftiz-cizgi{animation:ftiz-cizgi 3.6s ease-in-out infinite}
      @keyframes ftiz-yuz{0%,100%{transform:scale(1)}50%{transform:scale(1.06) rotate(-3deg)}}
      @keyframes ftiz-kay{0%,55%{transform:translateX(0);opacity:0}70%{opacity:.85}100%{transform:translateX(74px);opacity:0}}
      @keyframes ftiz-nokta{0%,60%,100%{opacity:.5}30%{opacity:1}}
      @keyframes ftiz-cizgi{0%,100%{transform:scaleX(.35);opacity:.5}50%{transform:scaleX(1);opacity:1}}
      @media (prefers-reduced-motion:reduce){.ftiz-balon,.ftiz-par,.ftiz-c1,.ftiz-c2,.ftiz-cizgi{animation:none}.ftiz-par{opacity:0}}
    </style>
  </defs>
  <g class="ftiz-balon">
    <use href="#ftiz-b" fill="#000" opacity=".16" transform="translate(1 2)"/>
    <use href="#ftiz-b" fill="url(#ftiz-g)"/>
    <g clip-path="url(#ftiz-c)"><rect class="ftiz-par" x="-16" y="-6" width="12" height="76" fill="#fff" opacity="0"/></g>
    <rect class="ftiz-c1" x="17" y="20" width="30" height="5" rx="2.5" fill="#fff"/>
    <rect class="ftiz-c2" x="17" y="30" width="20" height="5" rx="2.5" fill="#fff"/>
  </g>
  <text class="ftiz-ust" x="74" y="24" fill="#9aa0ab">TÜRKÇE ÇEVİRİ</text>
  <text class="ftiz-ad" x="73" y="47" fill="url(#ftiz-txt)">Flarum Türkiye</text>
  <rect class="ftiz-cizgi" x="74" y="53" width="150" height="2" rx="1" fill="url(#ftiz-txt)" transform-origin="74px 54px"/>
</svg>
